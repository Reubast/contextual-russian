name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      HOST: ssh.aic7997609.nichost.ru
      SSH_USER: aic7997609
      REMOTE_DIR: aictx.ru/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.NICHOST_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "Secret NICHOST_SSH_KEY is empty"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "ssh.aic7997609.nichost.ru ssh-rsa " > ~/.ssh/known_hosts

      - name: Upload files
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UpdateHostKeys=no"
          ssh $SSH_OPTS "$SSH_USER@$HOST" "mkdir -p ~/$REMOTE_DIR/en ~/$REMOTE_DIR/zh ~/$REMOTE_DIR/hi ~/aictx.ru/cgi-bin"
          for f in README.md index.html robots.txt sitemap.xml yandex_a11cd095edcedbaf.html googleae9ca30a621e7f44.html en/index.html zh/index.html hi/index.html; do
            scp $SSH_OPTS "$f" "$SSH_USER@$HOST:$REMOTE_DIR/$f"
          done
          scp $SSH_OPTS "cgi-bin/kp.py" "$SSH_USER@$HOST:aictx.ru/cgi-bin/kp.py"
          printf 'YANDEX_API_KEY = "%s"\nYANDEX_FOLDER_ID = "%s"\n' "$YANDEX_API_KEY" "$YANDEX_FOLDER_ID" > kp_config.py
          scp $SSH_OPTS kp_config.py "$SSH_USER@$HOST:aictx.ru/cgi-bin/kp_config.py"
          rm kp_config.py
          ssh $SSH_OPTS "$SSH_USER@$HOST" "chmod +x ~/aictx.ru/cgi-bin/kp.py"

      - name: Verify
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UpdateHostKeys=no"
          for f in README.md index.html robots.txt sitemap.xml yandex_a11cd095edcedbaf.html googleae9ca30a621e7f44.html en/index.html zh/index.html hi/index.html; do
            REMOTE_SUM=$(ssh $SSH_OPTS "$SSH_USER@$HOST" "sha256sum ~/$REMOTE_DIR/$f" | cut -d' ' -f1)
            LOCAL_SUM=$(sha256sum "$f" | cut -d' ' -f1)
            test "$REMOTE_SUM" = "$LOCAL_SUM" && echo "OK: $f matches" || { echo "Checksum mismatch: $f"; exit 1; }
          done
