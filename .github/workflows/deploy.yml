name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      HOST: ssh.aic7997609.nichost.ru
      SSH_USER: aic7997609
      REMOTE_DIR: aictx.ru/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.NICHOST_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "Secret NICHOST_SSH_KEY is empty"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "ssh.aic7997609.nichost.ru ssh-rsa " > ~/.ssh/known_hosts

      - name: Upload files
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UpdateHostKeys=no"
          for f in README.md index.html robots.txt sitemap.xml; do
            scp $SSH_OPTS "$f" "$SSH_USER@$HOST:$REMOTE_DIR/$f"
          done

      - name: Verify
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UpdateHostKeys=no"
          for f in README.md index.html robots.txt sitemap.xml; do
            REMOTE_SUM=$(ssh $SSH_OPTS "$SSH_USER@$HOST" "sha256sum ~/$REMOTE_DIR/$f" | cut -d' ' -f1)
            LOCAL_SUM=$(sha256sum "$f" | cut -d' ' -f1)
            test "$REMOTE_SUM" = "$LOCAL_SUM" && echo "OK: $f matches" || { echo "Checksum mismatch: $f"; exit 1; }
          done
