<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контекстный русский</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #fafafa;
            color: #222;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.6;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 15vh 24px 0;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.6em;
            font-weight: normal;
            margin: 0 0 0.6em;
        }
        p {
            margin: 0 0 0.4em;
        }
        .date {
            color: #777;
            font-size: 0.9em;
        }
        footer {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
            color: #777;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <main>
        <h1>Контекстный русский</h1>
        <p>Прикладная дисциплина...</p>
        <p class="date">Дата основания: 16 октября 2026 г.</p>
    </main>
    <footer>Евгений Сидякин</footer>
</body>
</html>
